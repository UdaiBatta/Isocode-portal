<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" role="img" aria-label="Risk points on a 0 to 100 scale. Fee trouble alone caps at 40 and attendance at 35, reaching Watch at most. Test decline alone caps at 25, below Watch. High starts at 60, so it needs at least two signals together." font-family="Inter, 'Noto Sans Devanagari', Arial, sans-serif" font-size="11.5" fill="#17231d">
  <rect width="680" height="216" fill="#fff"/>
  <!-- Scale: 4.5 px per point from x=150, so 100 points ends at x=600 -->
  <rect x="307.5" y="34" width="112.5" height="170" fill="#faf3e2"/>
  <rect x="420" y="34" width="180" height="170" fill="#fbeeec"/>
  <text x="363" y="26" text-anchor="middle" font-weight="700" fill="#8a5a00">Watch, from 35</text>
  <text x="510" y="26" text-anchor="middle" font-weight="700" fill="#b3261e">High, from 60: call task</text>
  <g stroke-dasharray="4 3" stroke-width="1.3"><line x1="307.5" y1="34" x2="307.5" y2="204" stroke="#8a5a00"/><line x1="420" y1="34" x2="420" y2="204" stroke="#b3261e"/></g>
  <!-- Rows -->
  <g text-anchor="end" font-weight="600"><text x="140" y="60">Fees alone, at most</text><text x="140" y="92">Attendance alone</text><text x="140" y="124">Test decline alone</text><text x="140" y="156">Fees + attendance</text><text x="140" y="188">All three</text></g>
  <g fill="#25502e"><rect x="150" y="46" width="180" height="20"/><rect x="150" y="142" width="180" height="20"/><rect x="150" y="174" width="180" height="20"/></g>
  <g fill="#6d8f75"><rect x="150" y="78" width="157.5" height="20"/><rect x="330" y="142" width="157.5" height="20"/><rect x="330" y="174" width="157.5" height="20"/></g>
  <g fill="#a9b8ab"><rect x="150" y="110" width="112.5" height="20"/><rect x="487.5" y="174" width="112.5" height="20"/></g>
  <g fill="#fff" font-weight="700" text-anchor="middle"><text x="240" y="60">40</text><text x="229" y="92">35</text><text x="240" y="156">40</text><text x="409" y="156">35</text><text x="240" y="188">40</text><text x="409" y="188">35</text></g>
  <g font-weight="700" text-anchor="middle"><text x="206" y="124">25</text><text x="544" y="188">25</text></g>
  <g font-weight="600"><text x="338" y="60" fill="#8a5a00">Watch only</text><text x="315" y="92" fill="#8a5a00">Watch only</text><text x="270" y="124" fill="#48564d">None</text><text x="495" y="156" fill="#b3261e">75: High</text><text x="608" y="188" fill="#b3261e">100</text></g>
</svg>
