<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" role="img" aria-label="A signed payment event is checked for repeats, then the student and instalment rows are locked and the amount compared with the live balance. An exact ₹15,000 allocates and issues a GST receipt. ₹14,000 goes to the unmatched queue for accounts to match or reject. A failed or pending event changes nothing." font-family="Inter, 'Noto Sans Devanagari', Arial, sans-serif" font-size="11.5" fill="#17231d">
  <defs>
    <marker id="pf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#17231d"/></marker>
    <marker id="pf-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#25502e"/></marker>
    <marker id="pf-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a5a00"/></marker>
  </defs>
  <rect width="680" height="292" fill="#fff"/>
  <!-- Spine -->
  <g stroke="#17231d" stroke-width="1.2" fill="#fff">
    <rect x="10" y="122" width="84" height="56" rx="6"/><rect x="114" y="122" width="84" height="56" rx="6"/><rect x="222" y="122" width="96" height="56" rx="6"/>
    <rect x="114" y="226" width="176" height="46" rx="6" fill="#f4f6f4"/>
  </g>
  <g text-anchor="middle">
    <text x="52" y="146" font-weight="700">Signed event</text><text x="52" y="162">instalment 3</text>
    <text x="156" y="146" font-weight="700">event_id</text><text x="156" y="162">seen before?</text>
    <text x="270" y="146" font-weight="700">Lock rows</text><text x="270" y="162">read live balance</text>
    <text x="202" y="245" font-weight="700">Return the stored result</text><text x="202" y="261">nothing is applied twice</text>
  </g>
  <g stroke="#17231d" stroke-width="1.3" marker-end="url(#pf-a)" fill="none">
    <line x1="94" y1="150" x2="113" y2="150"/><line x1="198" y1="150" x2="221" y2="150"/><line x1="156" y1="178" x2="156" y2="225"/>
  </g>
  <text x="210" y="116" text-anchor="middle">new</text><text x="163" y="205">repeat</text>
  <!-- Outcomes -->
  <rect x="450" y="12" width="220" height="80" rx="6" fill="#edf2ed" stroke="#25502e" stroke-width="1.8"/>
  <text x="462" y="31" font-weight="700" fill="#25502e">Allocate and issue GST receipt</text>
  <text x="462" y="48">₹12,711.86 taxable</text><text x="462" y="63">+ ₹1,144.07 CGST + ₹1,144.07 SGST</text><text x="462" y="80" font-weight="600">Derived balance ₹0; reminders stop</text>
  <rect x="450" y="118" width="220" height="80" rx="6" fill="#faf3e2" stroke="#8a5a00" stroke-width="1.5"/>
  <text x="462" y="137" font-weight="700" fill="#8a5a00">Unmatched queue</text>
  <text x="462" y="154">Also: unknown reference, withdrawn,</text><text x="462" y="169">already paid</text><text x="462" y="186" font-weight="600">Parent sees Checking; no receipt</text>
  <rect x="450" y="226" width="220" height="46" rx="6" fill="#f4f6f4" stroke="#48564d" stroke-width="1.2"/>
  <text x="462" y="245" font-weight="700">No allocation, no receipt</text><text x="462" y="261">A result URL cannot fake success</text>
  <!-- Fan out -->
  <g fill="none" stroke-width="1.4">
    <path d="M318 150H330V52H449" stroke="#25502e" marker-end="url(#pf-g)"/>
    <path d="M330 150H449" stroke="#8a5a00" marker-end="url(#pf-m)"/>
    <path d="M330 150V249H449" stroke="#17231d" marker-end="url(#pf-a)"/>
  </g>
  <text x="338" y="46" fill="#25502e" font-weight="600">₹15,000 = balance</text>
  <text x="338" y="144" fill="#8a5a00" font-weight="600">₹14,000 ≠ ₹15,000</text>
  <text x="338" y="243">failed or pending</text>
  <!-- Human resolution -->
  <line x1="560" y1="118" x2="560" y2="93" stroke="#25502e" stroke-width="1.4" marker-end="url(#pf-g)"/>
  <text x="567" y="109" fill="#25502e">accounts: match</text>
  <text x="548" y="109" text-anchor="end" fill="#8a5a00">or reject, with note</text>
</svg>
