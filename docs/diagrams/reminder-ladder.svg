<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" role="img" aria-label="Ishita's third instalment is due on 10 October. Reminder steps fall on 3, 7, 10, 13, 17 and 25 October and 9 November, drawn to scale. Today is 2 November. On 9 November the run rechecks the balance: if money is still due the +30 step sends once; if paid or withdrawn it never sends." font-family="Inter, 'Noto Sans Devanagari', Arial, sans-serif" font-size="11.5" fill="#17231d">
  <defs>
    <marker id="rl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#17231d"/></marker>
    <marker id="rl-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#25502e"/></marker>
    <marker id="rl-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b3261e"/></marker>
  </defs>
  <rect width="680" height="268" fill="#fff"/>
  <!-- Outage rule over +3, +7, +15 -->
  <path d="M198 66V58H399V66" fill="none" stroke="#8a5a00" stroke-width="1.3"/>
  <text x="298" y="36" text-anchor="middle" fill="#8a5a00" font-weight="600">Service down across these?</text>
  <text x="298" y="51" text-anchor="middle" fill="#8a5a00">The next run sends only the latest step</text>
  <!-- Axis: 16.76 px per day from 3 Oct -->
  <line x1="30" y1="104" x2="650" y2="104" stroke="#17231d" stroke-width="1.6"/>
  <g fill="#25502e"><circle cx="30" cy="104" r="6"/><circle cx="97" cy="104" r="6"/><circle cx="198" cy="104" r="6"/><circle cx="265" cy="104" r="6"/><circle cx="399" cy="104" r="6"/></g>
  <circle cx="147" cy="104" r="8" fill="#b3261e"/>
  <circle cx="650" cy="104" r="6" fill="#fff" stroke="#25502e" stroke-width="2"/>
  <g text-anchor="middle" font-weight="700"><text x="30" y="88">-7</text><text x="97" y="88">-3</text><text x="147" y="88" fill="#b3261e">due</text><text x="198" y="88">+3</text><text x="265" y="88">+7</text><text x="399" y="88">+15</text><text x="650" y="88">+30</text></g>
  <g text-anchor="middle" fill="#48564d"><text x="30" y="126">3 Oct</text><text x="97" y="126">7 Oct</text><text x="147" y="126">10 Oct</text><text x="198" y="126">13 Oct</text><text x="265" y="126">17 Oct</text><text x="399" y="126">25 Oct</text><text x="650" y="126" text-anchor="end">9 Nov</text></g>
  <!-- Today -->
  <line x1="533" y1="70" x2="533" y2="132" stroke="#17231d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="533" y="50" text-anchor="middle" font-weight="700">Today, 2 Nov</text><text x="533" y="65" text-anchor="middle">₹15,000 left</text>
  <text x="30" y="166" fill="#48564d">Filled: step date has passed.</text><text x="30" y="182" fill="#48564d">Hollow: still to come.</text>
  <!-- The next run -->
  <line x1="650" y1="134" x2="650" y2="150" stroke="#17231d" stroke-width="1.3" marker-end="url(#rl-a)"/>
  <rect x="470" y="151" width="200" height="40" rx="6" fill="#fff" stroke="#17231d" stroke-width="1.2"/>
  <text x="570" y="167" text-anchor="middle" font-weight="700">Run on 9 Nov</text><text x="570" y="182" text-anchor="middle">locks and rechecks live balance</text>
  <rect x="220" y="212" width="225" height="46" rx="6" fill="#fbeeec" stroke="#b3261e" stroke-width="1.4"/>
  <text x="232" y="231" font-weight="700" fill="#b3261e">Paid or withdrawn: +30 never sends</text><text x="232" y="247">Timeline shows Stopped: paid</text>
  <rect x="470" y="212" width="200" height="46" rx="6" fill="#edf2ed" stroke="#25502e" stroke-width="1.5"/>
  <text x="482" y="231" font-weight="700" fill="#25502e">Still due: +30 sends once</text><text x="482" y="247">Part paid: asks for the remainder</text>
  <path d="M470 171H332V211" fill="none" stroke="#b3261e" stroke-width="1.4" marker-end="url(#rl-r)"/>
  <line x1="570" y1="191" x2="570" y2="211" stroke="#25502e" stroke-width="1.4" marker-end="url(#rl-g)"/>
</svg>
